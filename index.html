<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Sara Goes to Work</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        #game-container {
            width: 100%; height: 100%;
            position: fixed; top: 0; left: 0;
        }
        canvas { display: block; }

        /* HUD overlay */
        #hud {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 10;
        }
        #hud-left, #hud-right {
            display: flex; flex-direction: column; gap: 8px;
        }
        .hud-item {
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .hud-item .label {
            color: rgba(255,255,255,0.5);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .hud-item .value {
            font-size: 20px;
            font-variant-numeric: tabular-nums;
        }

        /* Health bar */
        #health-bar-container {
            width: 160px; height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        #health-bar {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #ff4444, #ff6666);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* Ammo bar */
        #ammo-bar-container {
            width: 160px; height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        #ammo-bar {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #ffaa00, #ffcc44);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* Crosshair */
        #crosshair {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; z-index: 20;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.8);
            border-radius: 1px;
        }
        #crosshair::before {
            width: 2px; height: 20px;
            top: -10px; left: -1px;
        }
        #crosshair::after {
            width: 20px; height: 2px;
            top: -1px; left: -10px;
        }
        #crosshair-dot {
            width: 4px; height: 4px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            position: absolute;
            top: -2px; left: -2px;
        }

        /* Mobile touch controls */
        #touch-controls {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 50%;
            display: none;
            z-index: 15;
        }
        .touch-zone {
            position: absolute;
            bottom: 20px;
            width: 140px; height: 140px;
        }
        #joystick-zone { left: 20px; }
        #fire-zone { right: 20px; }

        /* Joystick */
        #joystick-base {
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            position: relative;
        }
        #joystick-thumb {
            width: 50px; height: 50px;
            background: rgba(255,255,255,0.3);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            transition: none;
        }

        /* Fire button */
        #fire-btn {
            width: 80px; height: 80px;
            background: rgba(255,50,50,0.3);
            border: 2px solid rgba(255,50,50,0.5);
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex; align-items: center; justify-content: center;
        }
        #fire-btn:active {
            background: rgba(255,50,50,0.5);
        }
        #fire-btn::after {
            content: '🔫';
            font-size: 28px;
        }

        /* Look zone (right half of screen) */
        #look-zone {
            position: absolute;
            top: 0; right: 0;
            width: 50%; height: 100%;
        }

        /* Start screen */
        #start-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        #start-screen h1 {
            color: #fff;
            font-size: 36px;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(255,100,0,0.5);
        }
        #start-screen p {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 32px;
            text-align: center;
            line-height: 1.6;
        }
        #start-btn {
            background: linear-gradient(135deg, #ff6600, #ff3300);
            color: #fff;
            border: none;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(255,50,0,0.4);
        }
        #start-btn:active {
            transform: scale(0.95);
        }

        /* Game over screen */
        #game-over {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #game-over h2 {
            color: #ff4444;
            font-size: 42px;
            margin-bottom: 16px;
        }
        #final-score {
            color: #fff;
            font-size: 24px;
            margin-bottom: 32px;
        }
        #restart-btn {
            background: linear-gradient(135deg, #ff6600, #ff3300);
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Wave announcement */
        #wave-announce {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255,100,0,0.8);
            pointer-events: none;
            z-index: 25;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #wave-announce.show {
            opacity: 1;
        }

        /* Damage flash */
        #damage-flash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,0,0,0.3);
            pointer-events: none;
            z-index: 30;
            opacity: 0;
            transition: opacity 0.1s;
        }
        #damage-flash.show {
            opacity: 1;
        }

        /* Reload indicator */
        #reload-indicator {
            position: fixed;
            bottom: 100px; left: 50%;
            transform: translateX(-50%);
            color: #ffaa00;
            font-size: 16px;
            font-weight: 600;
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #reload-indicator.show {
            opacity: 1;
        }

        /* Mobile detection */
        @media (hover: none) and (pointer: coarse) {
            #touch-controls { display: block; }
            #crosshair { display: none; }
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <!-- HUD -->
    <div id="hud">
        <div id="hud-left">
            <div class="hud-item">
                <div class="label">Health</div>
                <div class="value" id="health-value">100</div>
                <div id="health-bar-container">
                    <div id="health-bar"></div>
                </div>
            </div>
            <div class="hud-item">
                <div class="label">Score</div>
                <div class="value" id="score-value">0</div>
            </div>
        </div>
        <div id="hud-right">
            <div class="hud-item">
                <div class="label">Wave</div>
                <div class="value" id="wave-value">1</div>
            </div>
            <div class="hud-item">
                <div class="label">Ammo</div>
                <div class="value" id="ammo-value">30</div>
                <div id="ammo-bar-container">
                    <div id="ammo-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Crosshair -->
    <div id="crosshair">
        <div id="crosshair-dot"></div>
    </div>

    <!-- Touch controls -->
    <div id="touch-controls">
        <div class="touch-zone" id="joystick-zone">
            <div id="joystick-base">
                <div id="joystick-thumb"></div>
            </div>
        </div>
        <div class="touch-zone" id="fire-zone">
            <div id="fire-btn"></div>
        </div>
        <div id="look-zone"></div>
    </div>

    <!-- Start screen -->
    <div id="start-screen">
        <h1>Sara Goes to Work</h1>
        <p>
            WASD to move • Mouse to look • Click to fire<br>
            R to reload • Survive the waves
        </p>
        <button id="start-btn">PLAY</button>
    </div>

    <!-- Game over -->
    <div id="game-over">
        <h2>GAME OVER</h2>
        <div id="final-score">Score: 0</div>
        <button id="restart-btn">PLAY AGAIN</button>
    </div>

    <!-- Wave announcement -->
    <div id="wave-announce"></div>

    <!-- Damage flash -->
    <div id="damage-flash"></div>

    <!-- Reload indicator -->
    <div id="reload-indicator">RELOADING...</div>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="game.js"></script>
</body>
</html>
