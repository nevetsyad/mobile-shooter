<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mobile 3D Shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  #ui { position: fixed; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 10; }
  #score { color: #0f0; font: bold 24px monospace; text-shadow: 0 0 8px #0f0; padding: 12px 16px; }
  #health-bar { position: fixed; bottom: 160px; left: 50%; transform: translateX(-50%); width: 200px; height: 12px; background: #333; border: 2px solid #555; border-radius: 6px; z-index: 10; }
  #health-fill { height: 100%; background: #0f0; border-radius: 4px; transition: width 0.2s, background 0.2s; }
  #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 24px; height: 24px; z-index: 10; pointer-events: none; }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.7); }
  #crosshair::before { width: 2px; height: 24px; left: 11px; top: 0; }
  #crosshair::after { width: 24px; height: 2px; top: 11px; left: 0; }
  #joystick-zone { position: fixed; bottom: 0; width: 50%; height: 180px; z-index: 20; }
  #left-zone { left: 0; }
  #right-zone { right: 0; }
  .joystick-base { position: absolute; width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25); pointer-events: none; display: none; }
  .joystick-thumb { position: absolute; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.4); border: 2px solid rgba(255,255,255,0.6); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  #fire-btn { position: fixed; bottom: 30px; right: 30px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,50,50,0.35); border: 3px solid rgba(255,80,80,0.7); z-index: 30; display: flex; align-items: center; justify-content: center; color: #fff; font: bold 14px monospace; pointer-events: auto; }
  #fire-btn:active { background: rgba(255,50,50,0.6); }
  #fire-btn .icon { font-size: 28px; }
  #start-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
  #start-screen h1 { color: #0f0; font: bold 32px monospace; text-shadow: 0 0 20px #0f0; margin-bottom: 12px; }
  #start-screen p { color: #aaa; font: 16px sans-serif; margin: 4px 0; }
  #start-btn { margin-top: 30px; padding: 16px 48px; background: #0a0; color: #000; font: bold 20px sans-serif; border: none; border-radius: 8px; cursor: pointer; }
  #game-over { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
  #game-over h1 { color: #f00; font: bold 36px monospace; text-shadow: 0 0 20px #f00; margin-bottom: 12px; }
  #game-over p { color: #ccc; font: 20px monospace; margin: 4px 0; }
  #restart-btn { margin-top: 30px; padding: 16px 48px; background: #a00; color: #fff; font: bold 20px sans-serif; border: none; border-radius: 8px; cursor: pointer; }
  #wave-info { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff0; font: bold 36px monospace; text-shadow: 0 0 20px #ff0; z-index: 50; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
</style>
</head>
<body>

<div id="start-screen">
  <h1>3D SHOOTER</h1>
  <p>Left joystick: move</p>
  <p>Right joystick: look</p>
  <p>Red button: fire</p>
  <p>Survive waves of enemies!</p>
  <button id="start-btn">START</button>
</div>

<div id="game-over">
  <h1>GAME OVER</h1>
  <p>Score: <span id="final-score">0</span></p>
  <p>Wave: <span id="final-wave">1</span></p>
  <button id="restart-btn">PLAY AGAIN</button>
</div>

<div id="ui">
  <div id="score">Score: 0</div>
</div>
<div id="health-bar"><div id="health-fill" style="width:100%"></div></div>
<div id="crosshair"></div>
<div id="wave-info"></div>

<div id="joystick-zone" id="left-zone"></div>
<div id="joystick-zone" id="right-zone"></div>

<div class="joystick-base" id="left-base"><div class="joystick-thumb" id="left-thumb"></div></div>
<div class="joystick-base" id="right-base"><div class="joystick-thumb" id="right-thumb"></div></div>

<div id="fire-btn"><span class="icon">●</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Game State ───
let scene, camera, renderer, clock;
let moveInput = { x: 0, y: 0 }; // left joystick
let lookInput = { x: 0, y: 0 }; // right joystick
let enemies = [];
let bullets = [];
let particles = [];
let score = 0;
let health = 100;
let wave = 1;
let enemiesRemaining = 0;
let waveActive = false;
let gameRunning = false;
let playerYaw = 0, playerPitch = 0;
let playerPos = new THREE.Vector3(0, 1.7, 0);
let fireCooldown = 0;
let groundMesh;
const ENEMY_SPEED = 3;
const BULLET_SPEED = 40;
const FIRE_RATE = 0.12;
let lastTime = 0;

// ─── Touch Joystick Logic ───
const touchState = { left: null, right: null }; // { id, startX, startY, baseEl, thumbEl }

function handleTouchStart(e) {
  e.preventDefault();
  const rect = document.body.getBoundingClientRect();
  for (let t of e.changedTouches) {
    const x = t.clientX - rect.left;
    const y = t.clientY - rect.top;
    const halfW = window.innerWidth / 2;
    if (x < halfW && !touchState.left) {
      touchState.left = { id: t.identifier, startX: x, startY: y };
      showJoystick('left', x, y);
    } else if (x >= halfW && !touchState.right) {
      touchState.right = { id: t.identifier, startX: x, startY: y };
      showJoystick('right', x, y);
    }
  }
}

function handleTouchMove(e) {
  e.preventDefault();
  for (let t of e.changedTouches) {
    const halfW = window.innerWidth / 2;
    let state;
    if (t.identifier === touchState.left?.id) state = touchState.left;
    else if (t.identifier === touchState.right?.id) state = touchState.right;
    if (!state) continue;

    const dx = t.clientX - state.startX;
    const dy = t.clientY - state.startY;
    const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
    const angle = Math.atan2(dy, dx);
    const nx = Math.cos(angle) * dist;
    const ny = Math.sin(angle) * dist;

    const thumb = state.startX < halfW ? leftThumb : rightThumb;
    const base = state.startX < halfW ? leftBase : rightBase;
    thumb.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
    base.style.display = 'block';

    const norm = dist / 50;
    if (state.startX < halfW) {
      moveInput.x = nx / 50;
      moveInput.y = ny / 50;
    } else {
      lookInput.x = nx / 50;
      lookInput.y = ny / 50;
    }
  }
}

function handleTouchEnd(e) {
  e.preventDefault();
  for (let t of e.changedTouches) {
    if (t.identifier === touchState.left?.id) {
      touchState.left = null;
      moveInput.x = 0; moveInput.y = 0;
      leftBase.style.display = 'none';
    }
    if (t.identifier === touchState.right?.id) {
      touchState.right = null;
      lookInput.x = 0; lookInput.y = 0;
      rightBase.style.display = 'none';
    }
  }
}

let leftBase, leftThumb, rightBase, rightThumb;

function showJoystick(side, x, y) {
  const base = side === 'left' ? leftBase : rightBase;
  const thumb = side === 'left' ? leftThumb : rightThumb;
  base.style.left = (x - 50) + 'px';
  base.style.top = (y - 50) + 'px';
  base.style.display = 'block';
  thumb.style.transform = 'translate(-50%, -50%)';
}

document.addEventListener('touchstart', handleTouchStart, { passive: false });
document.addEventListener('touchmove', handleTouchMove, { passive: false });
document.addEventListener('touchend', handleTouchEnd, { passive: false });
document.addEventListener('touchcancel', handleTouchEnd, { passive: false });

// ─── Keyboard fallback (for testing on desktop) ───
const keys = {};
document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);

function updateInput() {
  if (keys['KeyW'] || keys['ArrowUp']) moveInput.y = -1;
  else if (keys['KeyS'] || keys['ArrowDown']) moveInput.y = 1;
  else if (!touchState.left) moveInput.y = 0;

  if (keys['KeyA'] || keys['ArrowLeft']) moveInput.x = -1;
  else if (keys['KeyD'] || keys['ArrowRight']) moveInput.x = 1;
  else if (!touchState.left) moveInput.x = 0;
}

// ─── Fire ───
const fireBtn = document.getElementById('fire-btn');
let firing = false;
fireBtn.addEventListener('touchstart', e => { e.preventDefault(); firing = true; });
fireBtn.addEventListener('touchend', e => { firing = false; });
fireBtn.addEventListener('mousedown', () => firing = true);
fireBtn.addEventListener('mouseup', () => firing = false);
document.addEventListener('keydown', e => { if (e.code === 'Space') firing = true; });
document.addEventListener('keyup', e => { if (e.code === 'Space') firing = false; });

// ─── Three.js Setup ───
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);
  scene.fog = new THREE.Fog(0x1a1a2e, 30, 80);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.copy(playerPos);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  clock = new THREE.Clock();

  // Lights
  const ambient = new THREE.AmbientLight(0x404060, 0.6);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  scene.add(dirLight);

  // Ground
  const groundGeo = new THREE.PlaneGeometry(200, 200);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3e, roughness: 0.9 });
  groundMesh = new THREE.Mesh(groundGeo, groundMat);
  groundMesh.rotation.x = -Math.PI / 2;
  groundMesh.receiveShadow = true;
  scene.add(groundMesh);

  // Grid
  const grid = new THREE.GridHelper(200, 100, 0x333355, 0x222244);
  scene.add(grid);

  // Walls / obstacles
  createObstacles();

  // Weapon model (simple box attached to camera)
  const gunGeo = new THREE.BoxGeometry(0.08, 0.08, 0.5);
  const gunMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
  const gun = new THREE.Mesh(gunGeo, gunMat);
  gun.position.set(0.2, -0.15, -0.4);
  camera.add(gun);
  scene.add(camera);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function createObstacles() {
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  const boxMat = new THREE.MeshStandardMaterial({ color: 0x444466, roughness: 0.7 });
  for (let i = 0; i < 30; i++) {
    const s = 1 + Math.random() * 3;
    const h = 1 + Math.random() * 4;
    const box = new THREE.Mesh(boxGeo, boxMat);
    box.scale.set(s, h, s);
    const angle = Math.random() * Math.PI * 2;
    const dist = 10 + Math.random() * 60;
    box.position.set(Math.cos(angle) * dist, h / 2, Math.sin(angle) * dist);
    box.castShadow = true;
    box.receiveShadow = true;
    scene.add(box);
  }
}

// ─── Enemies ───
function spawnEnemy() {
  const group = new THREE.Group();

  // Body
  const bodyGeo = new THREE.CylinderGeometry(0.3, 0.4, 1.2, 8);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0x440000 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.6;
  body.castShadow = true;
  group.add(body);

  // Head
  const headGeo = new THREE.SphereGeometry(0.3, 8, 8);
  const headMat = new THREE.MeshStandardMaterial({ color: 0xff6666, emissive: 0x330000 });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 1.5;
  head.castShadow = true;
  group.add(head);

  // Eyes
  const eyeGeo = new THREE.SphereGeometry(0.07, 6, 6);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00 });
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
  eyeL.position.set(-0.12, 1.55, 0.25);
  group.add(eyeL);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
  eyeR.position.set(0.12, 1.55, 0.25);
  group.add(eyeR);

  const angle = Math.random() * Math.PI * 2;
  const dist = 25 + Math.random() * 30;
  group.position.set(
    playerPos.x + Math.cos(angle) * dist,
    0,
    playerPos.z + Math.sin(angle) * dist
  );

  group.userData = { health: 2 + Math.floor(wave / 3), speed: ENEMY_SPEED + wave * 0.2 };
  scene.add(group);
  enemies.push(group);
}

function spawnWave() {
  waveActive = true;
  const count = 3 + wave * 2;
  enemiesRemaining = count;
  showWaveInfo(`WAVE ${wave}`);
  for (let i = 0; i < count; i++) {
    setTimeout(() => spawnEnemy(), i * 500);
  }
}

function showWaveInfo(text) {
  const el = document.getElementById('wave-info');
  el.textContent = text;
  el.style.opacity = 1;
  setTimeout(() => el.style.opacity = 0, 2000);
}

// ─── Bullets ───
function fireBullet() {
  const geo = new THREE.SphereGeometry(0.06, 6, 6);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
  const bullet = new THREE.Mesh(geo, mat);
  bullet.position.copy(camera.position);

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  bullet.position.add(dir.clone().multiplyScalar(0.5));

  bullet.userData = { velocity: dir.multiplyScalar(BULLET_SPEED), life: 3 };
  scene.add(bullet);
  bullets.push(bullet);

  // Muzzle flash
  const flash = new THREE.PointLight(0xffff00, 3, 5);
  flash.position.copy(bullet.position);
  scene.add(flash);
  setTimeout(() => scene.remove(flash), 50);
}

// ─── Particles ───
function spawnParticles(pos, color, count) {
  for (let i = 0; i < count; i++) {
    const geo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
    const mat = new THREE.MeshBasicMaterial({ color });
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(pos);
    p.userData = {
      velocity: new THREE.Vector3(
        (Math.random() - 0.5) * 8,
        Math.random() * 6,
        (Math.random() - 0.5) * 8
      ),
      life: 0.5 + Math.random() * 0.5
    };
    scene.add(p);
    particles.push(p);
  }
}

// ─── Game Loop ───
function update(dt) {
  if (!gameRunning) return;

  updateInput();

  // Camera look (right joystick)
  const lookSens = 2.0;
  playerYaw -= lookInput.x * lookSens * dt;
  playerPitch -= lookInput.y * lookSens * dt;
  playerPitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, playerPitch));

  camera.rotation.order = 'YXZ';
  camera.rotation.y = playerYaw;
  camera.rotation.x = playerPitch;

  // Movement (left joystick) relative to camera yaw
  const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerYaw);
  const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerYaw);
  const moveDir = new THREE.Vector3();
  moveDir.addScaledVector(forward, -moveInput.y);
  moveDir.addScaledVector(right, moveInput.x);
  if (moveDir.length() > 0) moveDir.normalize();

  const speed = 6;
  camera.position.addScaledVector(moveDir, speed * dt);
  camera.position.y = 1.7;

  // Keep player on ground plane bounds
  camera.position.x = Math.max(-90, Math.min(90, camera.position.x));
  camera.position.z = Math.max(-90, Math.min(90, camera.position.z));

  playerPos.copy(camera.position);

  // Fire
  fireCooldown -= dt;
  if (firing && fireCooldown <= 0) {
    fireCooldown = FIRE_RATE;
    fireBullet();
  }

  // Update bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.position.addScaledVector(b.userData.velocity, dt);
    b.userData.life -= dt;
    if (b.userData.life <= 0) {
      scene.remove(b);
      bullets.splice(i, 1);
      continue;
    }

    // Bullet-enemy collision
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      const head = e.children[1]; // head mesh
      if (b.position.distanceTo(head.position) < 0.8) {
        e.userData.health--;
        spawnParticles(b.position, 0xff3333, 5);
        scene.remove(b);
        bullets.splice(i, 1);

        if (e.userData.health <= 0) {
          spawnParticles(e.position, 0xff6600, 20);
          scene.remove(e);
          enemies.splice(j, 1);
          score += 10 * wave;
          enemiesRemaining--;
          document.getElementById('score').textContent = `Score: ${score}`;

          if (enemiesRemaining <= 0 && waveActive) {
            waveActive = false;
            setTimeout(() => { wave++; spawnWave(); }, 2000);
          }
        }
        break;
      }
    }
  }

  // Update enemies
  for (const e of enemies) {
    const toPlayer = new THREE.Vector3();
    toPlayer.subVectors(camera.position, e.position);
    toPlayer.y = 0;
    const dist = toPlayer.length();
    toPlayer.normalize();

    if (dist > 2) {
      e.position.addScaledVector(toPlayer, e.userData.speed * dt);
      e.position.y = 0;
    }

    // Face player
    e.lookAt(new THREE.Vector3(camera.position.x, 0, camera.position.z));

    // Enemy damage
    if (dist < 2.5) {
      health -= 15 * dt;
      document.getElementById('health-fill').style.width = Math.max(0, health) + '%';
      if (health <= 50) {
        document.getElementById('health-fill').style.background = '#ff0';
      }
      if (health <= 0) {
        gameOver();
      }
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.velocity.y -= 15 * dt;
    p.position.addScaledVector(p.userData.velocity, dt);
    p.userData.life -= dt;
    if (p.userData.life <= 0) {
      scene.remove(p);
      particles.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
}

// ─── Game Flow ───
function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-over').style.display = 'none';
  score = 0;
  health = 100;
  wave = 1;
  playerYaw = 0;
  playerPitch = 0;
  camera.position.set(0, 1.7, 0);
  document.getElementById('score').textContent = 'Score: 0';
  document.getElementById('health-fill').style.width = '100%';
  document.getElementById('health-fill').style.background = '#0f0';

  // Clear old entities
  for (const e of enemies) scene.remove(e);
  enemies = [];
  for (const b of bullets) scene.remove(b);
  bullets = [];
  for (const p of particles) scene.remove(p);
  particles = [];

  gameRunning = true;
  spawnWave();
}

function gameOver() {
  gameRunning = false;
  document.getElementById('final-score').textContent = score;
  document.getElementById('final-wave').textContent = wave;
  document.getElementById('game-over').style.display = 'flex';
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

// ─── Init ───
leftBase = document.getElementById('left-base');
leftThumb = document.getElementById('left-thumb');
rightBase = document.getElementById('right-base');
rightThumb = document.getElementById('right-thumb');

init();
animate();
</script>
</body>
</html>
